<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="Talal Aamir — AI engineer"><title>Talal Aamir — AI engineer</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.muted{fill:#9198a1} .faint{fill:#656c76}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.f{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{from,to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important} .rise{opacity:1} .f{opacity:0} .f.last{opacity:1}
}
.dot{fill:#3fb950}
.pulse{fill:#3fb950;transform-origin:center;transform-box:fill-box;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.role{opacity:0;animation:role 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes role{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:none}
25%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.line{stroke:#f0f6fc;stroke-dasharray:56;stroke-dashoffset:56;animation:draw .9s cubic-bezier(.2,.8,.2,1) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.role{opacity:0} .role.r0{opacity:1} .line{stroke-dashoffset:0}}</style><g class="rise"><rect x="355.0" y="14" width="130" height="28" rx="14" fill="none" stroke="#3d444d"/><circle class="pulse" cx="373.0" cy="28" r="3.5"/><circle class="dot" cx="373.0" cy="28" r="3.5"/><text class="muted" x="386.0" y="32.5" font-size="12.5" font-weight="500">Paris, France</text></g><text class="rise" x="420.0" y="104" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-2" style="animation-delay:.1s">Talal Aamir</text><line class="line" x1="392.0" y1="126" x2="448.0" y2="126" stroke-width="2" stroke-linecap="round"/><text class="role r0 muted" x="420.0" y="166" text-anchor="middle" font-size="19" style="animation-delay:0.6s">AI Engineer at Safran Aircraft Engines</text><text class="role r1 muted" x="420.0" y="166" text-anchor="middle" font-size="19" style="animation-delay:3.6s">Computer science engineering student at CY Tech</text><text class="role r2 muted" x="420.0" y="166" text-anchor="middle" font-size="19" style="animation-delay:6.6s">Founder of Adib, an Arabic vocabulary app</text></svg>
