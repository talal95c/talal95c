25%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.line{stroke:#1f2328;stroke-dasharray:56;stroke-dashoffset:56;animation:draw .9s cubic-bezier(.2,.8,.2,1) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
