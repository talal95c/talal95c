<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="Talal Aamir — AI engineer"><title>Talal Aamir — AI engineer</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.muted{fill:#59636e} .faint{fill:#818b98}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.f{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes on{from,to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important} .rise{opacity:1} .f{opacity:0} .f.last{opacity:1}
}
.dot{fill:#1a7f37}
.pulse{fill:#1a7f37;transform-origin:center;transform-box:fill-box;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.role{opacity:0;animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
